version: "3.9"

# =============================================================
# CDC Lakehouse Platform — Docker Compose
# Services: PostgreSQL · Zookeeper · Kafka · Debezium
#           Spark Master/Worker · MinIO · Trino · Superset
# =============================================================

networks:
  cdc-net:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  minio-data:
  trino-data:
  superset-data:
  airflow-db-data:

# ── Shared health-check defaults ─────────────────────────────
x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 10s
  retries: 5
  start_period: 60s

services:

  # ══════════════════════════════════════════════════════════
  # PostgreSQL — Transactional source database
  # ══════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: cdc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdc_source}
      POSTGRES_USER: ${POSTGRES_USER:-cdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_pass}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - log_replication_commands=on
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdc_user} -d ${POSTGRES_DB:-cdc_source}"]
    networks:
      - cdc-net

  # ══════════════════════════════════════════════════════════
  # Zookeeper — Required by Kafka (classic mode)
  # ══════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cdc-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
    networks:
      - cdc-net

  # ══════════════════════════════════════════════════════════
  # Apache Kafka — Event streaming backbone
  # ══════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cdc-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 days
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
    networks:
      - cdc-net

  # ══════════════════════════════════════════════════════════
  # Debezium (Kafka Connect) — CDC engine
  # ══════════════════════════════════════════════════════════
  debezium:
    image: debezium/connect:2.4
    container_name: cdc-debezium
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect-group
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "8083:8083"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
    networks:
      - cdc-net

  # ══════════════════════════════════════════════════════════
  # MinIO — S3-compatible object storage (lakehouse backend)
  # ══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: cdc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-hshsh83skskk8lsk8320ljsks73}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio-data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
    networks:
      - cdc-net

  # ══════════════════════════════════════════════════════════
  # MinIO Init — Creates required buckets on startup
  # ══════════════════════════════════════════════════════════
  minio-init:
    image: minio/mc:latest
    container_name: cdc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-};
        mc mb --ignore-existing local/lakehouse-bronze;
        mc mb --ignore-existing local/lakehouse-silver;
        mc mb --ignore-existing local/lakehouse-gold;
        echo 'MinIO buckets ready.';
      "
    networks:
      - cdc-net

  # ══════════════════════════════════════════════════════════
  # Spark Master
  # ══════════════════════════════════════════════════════════
  spark-master:
    build:
      context: ./spark
    image: cdc-lakehouse-spark:latest  
    container_name: cdc-spark-master

    volumes:
      - ./spark:/spark
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

    environment:
      - SPARK_MODE=master

    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

    ports:
      - "8080:8080"
      - "7077:7077"

    networks:
      - cdc-net
  
  spark-worker:
    build:
      context: ./spark
    container_name: cdc-spark-worker

    environment:
      - SPARK_MODE=worker
      - spark.worker.cores=2
      - spark.worker.memory=4g
      - SPARK_MASTER_URL=spark://spark-master:7077
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=hshsh83skskk8lsk8320ljsks73

    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

    ports:
      - "8081:8081"

    depends_on:
      - spark-master

    networks:
      - cdc-net

  spark-worker-2:
    build:
      context: ./spark
    container_name: cdc-spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3g
      - SPARK_WORKER_CORES=2
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=hshsh83skskk8lsk8320ljsks73
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    networks:
      - cdc-net    

# ══════════════════════════════════════════════════════════
  # Trino — Distributed SQL query engine
  # ══════════════════════════════════════════════════════════
  trino:
    image: trinodb/trino:435
    container_name: cdc-trino
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8090:8080"   # Trino Web UI & API
    volumes:
      - ./trino/catalogs:/etc/trino/catalog:ro
      - trino-data:/data/trino
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
    networks:
      - cdc-net

  nessie:
    image: projectnessie/nessie:0.71.0
    container_name: cdc-nessie
    restart: unless-stopped
    ports:
      - "19120:19120"
    networks:
      - cdc-net  

  # ══════════════════════════════════════════════════════════
  # Apache Superset — BI dashboard platform
  # ══════════════════════════════════════════════════════════
  superset:
    image: apache/superset:3.1.0
    container_name: cdc-superset
    restart: unless-stopped
    depends_on:
      - trino
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset_secret_change_me}
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      ADMIN_FIRST_NAME: CDC
      ADMIN_LAST_NAME: Admin
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/app/superset_home
    command: /bin/bash -c "pip install sqlalchemy-trino && superset db upgrade && superset fab create-admin --username $$ADMIN_USERNAME --firstname $$ADMIN_FIRST_NAME --lastname $$ADMIN_LAST_NAME --email $$ADMIN_EMAIL --password $$ADMIN_PASSWORD || true && superset init && superset run -h 0.0.0.0 -p 8088"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
    networks:
      - cdc-net
  # ══════════════════════════════════════════════════════════
  # Bronze Ingestion — Spark Structured Streaming
  # Reads all 6 CDC topics from Kafka → writes to Bronze Iceberg
  # ══════════════════════════════════════════════════════════

  bronze-ingestion:
      build:
        context: ./spark
        dockerfile: Dockerfile
      container_name: cdc-bronze-ingestion
      depends_on:
        - spark-master
        - spark-worker
        - kafka
        - minio
        - nessie
      environment:
        - SPARK_MASTER_URL=spark://spark-master:7077
        - AWS_ACCESS_KEY_ID=minioadmin
        - AWS_SECRET_ACCESS_KEY=hshsh83skskk8lsk8320ljsks73
        - AWS_REGION=us-east-1                          # <-- ajoute ça aussi
      volumes:
        - ./spark/jobs:/spark/jobs
        - ./spark/config:/spark/config
      networks:
        - cdc-net
      command: >
        /opt/spark/bin/spark-submit
          --master spark://spark-master:7077
          --deploy-mode client
          --conf spark.executor.memory=1g
          --conf spark.driver.memory=1g
          --conf spark.executor.cores=2
          --conf spark.cores.max=2
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.nessie.NessieCatalog
          --conf spark.sql.catalog.iceberg.uri=http://nessie:19120/api/v1
          --conf spark.sql.catalog.iceberg.ref=main
          --conf spark.sql.catalog.iceberg.warehouse=s3a://lakehouse-bronze/warehouse
          --conf spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000
          --conf spark.sql.catalog.iceberg.s3.access-key-id=minioadmin
          --conf spark.sql.catalog.iceberg.s3.secret-access-key=hshsh83skskk8lsk8320ljsks73
          --conf spark.sql.catalog.iceberg.s3.path-style-access=true
          --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
          --conf spark.hadoop.fs.s3a.access.key=minioadmin
          --conf spark.hadoop.fs.s3a.secret.key=hshsh83skskk8lsk8320ljsks73
          --conf spark.hadoop.fs.s3a.path.style.access=true
          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
          --conf spark.driver.extraClassPath=/opt/spark/jars/*
          --conf spark.executor.extraClassPath=/opt/spark/jars/*
          --jars /opt/spark/jars/spark-sql-kafka-0-10_2.12-3.5.1.jar,/opt/spark/jars/kafka-clients-3.4.1.jar,/opt/spark/jars/spark-token-provider-kafka-0-10_2.12-3.5.1.jar,/opt/spark/jars/commons-pool2-2.11.1.jar,/opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar,/opt/spark/jars/hadoop-aws-3.3.4.jar,/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar,/opt/spark/jars/iceberg-nessie-1.5.2.jar,/opt/spark/jars/bundle-2.20.18.jar,/opt/spark/jars/url-connection-client-2.20.18.jar
          /spark/jobs/bronze_ingestion.py


  silver-processing:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: cdc-silver-processing
    depends_on:
      - spark-master
      - spark-worker
      - bronze-ingestion
      - nessie
      - minio
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=hshsh83skskk8lsk8320ljsks73
      - AWS_REGION=us-east-1
    volumes:
      - ./spark/jobs:/spark/jobs
      - ./spark/config:/spark/config
    networks:
      - cdc-net
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --deploy-mode client
        --conf spark.executor.memory=1g
        --conf spark.driver.memory=1g
        --conf spark.executor.cores=2
        --conf spark.cores.max=2
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.nessie.NessieCatalog
        --conf spark.sql.catalog.iceberg.uri=http://nessie:19120/api/v1
        --conf spark.sql.catalog.iceberg.ref=main
        --conf spark.sql.catalog.iceberg.warehouse=s3a://lakehouse-silver/warehouse
        --conf spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        --conf spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000
        --conf spark.sql.catalog.iceberg.s3.access-key-id=minioadmin
        --conf spark.sql.catalog.iceberg.s3.secret-access-key=hshsh83skskk8lsk8320ljsks73
        --conf spark.sql.catalog.iceberg.s3.path-style-access=true
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.access.key=minioadmin
        --conf spark.hadoop.fs.s3a.secret.key=hshsh83skskk8lsk8320ljsks73
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
        --conf spark.driver.extraClassPath=/opt/spark/jars/*
        --conf spark.executor.extraClassPath=/opt/spark/jars/*
        --jars /opt/spark/jars/spark-sql-kafka-0-10_2.12-3.5.1.jar,/opt/spark/jars/kafka-clients-3.4.1.jar,/opt/spark/jars/spark-token-provider-kafka-0-10_2.12-3.5.1.jar,/opt/spark/jars/commons-pool2-2.11.1.jar,/opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar,/opt/spark/jars/hadoop-aws-3.3.4.jar,/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar,/opt/spark/jars/iceberg-nessie-1.5.2.jar,/opt/spark/jars/bundle-2.20.18.jar,/opt/spark/jars/url-connection-client-2.20.18.jar
        /spark/jobs/silver_processing.py    
  
  gold-processing:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: cdc-gold-processing
    depends_on:
      - spark-master
      - spark-worker
      - silver-processing
      - nessie
      - minio
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=hshsh83skskk8lsk8320ljsks73
      - AWS_REGION=us-east-1
    volumes:
      - ./spark/jobs:/spark/jobs
      - ./spark/config:/spark/config
      - ./spark/entrypoint-gold.sh:/entrypoint-gold.sh  # ← AJOUTER CETTE LIGNE
    networks:
      - cdc-net
    command: ["/bin/bash", "/entrypoint-gold.sh"]  # ← MODIFIER ICI
    # Supprimez ou commentez l'ancienne commande



  # ══════════════════════════════════════════════════════════
  # Data Generator — Automated traffic simulation
  # ══════════════════════════════════════════════════════════
  data-generator:
    build:
      context: ./data-generator
    container_name: cdc-data-generator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-cdc_source}
      POSTGRES_USER: ${POSTGRES_USER:-cdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_pass}
    networks:
      - cdc-net
  # ══════════════════════════════════════════════════════════
  # Apache Airflow — Orchestrateur de pipelines
  # ══════════════════════════════════════════════════════════
  airflow-db:
    image: postgres:15-alpine
    container_name: cdc-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_pass
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
    networks:
      - cdc-net

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: cdc-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nQ8G00=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-airflow_secret_change_me}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname CDC \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    networks:
      - cdc-net

  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: cdc-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nQ8G00=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-airflow_secret_change_me}
      # Connexions aux services CDC
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
      AIRFLOW_CONN_POSTGRES_CDC: postgresql+psycopg2://${POSTGRES_USER:-cdc_user}:${POSTGRES_PASSWORD:-cdc_pass}@postgres:5432/${POSTGRES_DB:-cdc_source}
    ports:
      - "8089:8080"   # Airflow Web UI
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark/jobs:/opt/airflow/spark_jobs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
    networks:
      - cdc-net

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: cdc-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nQ8G00=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-airflow_secret_change_me}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark/jobs:/opt/airflow/spark_jobs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    networks:
      - cdc-net    